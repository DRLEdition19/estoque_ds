<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque & Inventário Online</title>
    
    <link rel="manifest" href="/estoque_ds/manifest.json">
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/DRLEdition19/estoque_ds/refs/heads/main/Logo%20DS%20com%20elipse.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/DRLEdition19/estoque_ds/refs/heads/main/Logo%20DS%20com%20elipse.png">
    
    <meta name="theme-color" content="#1a1a1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Estoque">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #faf8f5;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycby4zj1N0SI_rN4F33chiRuzGThf5fNuQfcwkuX7MMqaUucx08RN3iTb-1GJOGFpCliDUw/exec" allowfullscreen allow="autoplay; fullscreen"></iframe>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/estoque_ds/service-worker.js', { scope: '/estoque_ds/' })
                    .then(() => console.log('Service Worker registrado com sucesso!'))
                    .catch(err => console.error('Erro ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
